schema_version: 1
workspace_root: ../..

project:
  id: mkwii-rmcp01
  display_name: Mario Kart Wii PAL
  game_id: RMCP01
  region: P
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: mkwii_base

memory:
  base: 0x80000000
  size: 0x01A00000
  sda_base: 0x8038CC00
  sda2_base: 0x8038EFA0

inputs:
  dol:
    path: Assets/main.dol
    sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05

  rel:
    path: Assets/StaticR.rel
    load_address: 0x805102E0
    sha256: 16d9d146112541fefea701ecb5bc1a496f9d50e4a752fbb5b6778e7c6399f67d

translation:
  entry_points:
    - 0x800060A4
  function_map:
    path: projects/mkwii/MAP.txt
  # mkw100: mulli 0xF0 sites rewritten to reach overflow player slots (scripts/mkw100/slot_sites.py).
  player_slot_sites: projects/mkwii/mkw100/player-slot-sites.txt
  array_sites: projects/mkwii/mkw100/array-sites.txt

  #just a precaution, but this should never be needed for MKWii
  allow_unsupported_instructions: false 

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/mkwii_base_manifest.json

profiles:
  retro-rewind:
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    code_pul: PulsarPacks/completed/RetroRewind/RetroRewind6/Binaries/Code.pul
    mod_root: PulsarPacks/completed/RetroRewind/RetroRewind6
    region: P
    module_guest_base: 0x81800000
    module_link_base: 0x803992E0
    output: build/mods/retro_rewind_full_cpp
    enable_retro_wfc: true
    retro_wfc_payload: https://rwfc.net/api/wfc/payload?g=RMCPD00
    retro_wfc_legacy_bootstrap_hook: 0x800ED6E8
    riivolution:
      xml: xml/RetroRewind6.xml
      options:
        - section: Retro Rewind
          option: Pack
          choice: 1
  # Experimental: Retro Rewind with Item Fever's items, one combined module built by
  # scripts/mkw100/combine_pul.py (Build-MKW100.ps1 -RetroRewind ... -ItemFeverItems ...).
  rr-item-fever:
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    code_pul: PulsarPacks/combined/rr-item-fever/Code.pul
    mod_root: PulsarPacks/completed/RetroRewind/RetroRewind6
    region: P
    module_guest_base: 0x81800000
    module_link_base: 0x803992E0
    output: build/mods/rr_item_fever_full_cpp
    riivolution:
      xml: xml/RetroRewind6.xml
      options:
        - section: Retro Rewind
          option: Pack
          choice: 1
  item-fever:
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    code_pul: PulsarPacks/completed/ItemFever/ItemFever/Binaries/Code.pul
    mod_root: PulsarPacks/completed/ItemFever/ItemFever
    region: P
    module_guest_base: 0x81800000
    module_link_base: 0x803992E0
    output: build/mods/item_fever_full_cpp
    riivolution:
      # The Item Fever download keeps riivolution\ beside the ItemFever\ pack folder.
      xml: ../riivolution/ItemFever.xml
      options:
        - section: Item Fever
          option: Item Fever
          choice: 1
  formula-kart:
    # Formula Kart Wii (github.com/CLF78/FKW) is a Riivolution patch, not a Pulsar pack: its payload
    # is linked absolute at 0x808DD400 and patches the game once at boot. Build-MKW100.ps1
    # -FormulaKart turns that payload into a Kamek chunk (scripts/mkw100/fkw_to_kamek.py) staged as
    # code_pul below, so the module base and link base are both the payload's own address.
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    code_pul: PulsarPacks/completed/FormulaKart/fkw/Binaries/Code.pul
    mod_root: PulsarPacks/completed/FormulaKart/fkw
    region: P
    module_guest_base: 0x808DD400
    module_link_base: 0x808DD400
    output: build/mods/formula_kart_full_cpp
    riivolution:
      # The FKW download keeps riivolution\ beside the fkw\ folder, as Item Fever does.
      xml: ../riivolution/fkw.xml
      options:
        - section: FKW - Core Features
          option: Formula Kart Wii
          choice: 1
  splitscreen8:
    # MKWii 8P Splitscreen (github.com/therenow9/mkwii-8p-splitscreen, GPLv3): its "Mario Kart Wii" build,
    # rr-pulsar's SplitScreen8 module built without Retro Rewind (SS8_VANILLA). Build-MKW100.ps1
    # -SplitScreen8 stages the release's payload/mkw/Code.pul and the menu archives generated from the
    # disc (scripts/mkw100/ss8_stage_pack.py) into mod_root.
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    code_pul: PulsarPacks/completed/SplitScreen8/SplitScreen8/Binaries/Code.pul
    mod_root: PulsarPacks/completed/SplitScreen8/SplitScreen8
    region: P
    module_guest_base: 0x81800000
    module_link_base: 0x803992E0
    output: build/mods/splitscreen8_full_cpp
    riivolution:
      xml: xml/SplitScreen8.xml
      options:
        - section: SplitScreen8
          option: Pack
  insane-kart:
    # Insane Kart Wii (a Pulsar pack, all rights reserved: built from the user's own download only).
    # It ships no riivolution\ folder: its launcher reads Binaries\boot.thfs, which is a plain
    # Riivolution XML (RR-style patches; Seperate Savegame stays off so the save is the stage's NAND).
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    code_pul: PulsarPacks/completed/InsaneKart/IKWv3/Binaries/Code.pul
    mod_root: PulsarPacks/completed/InsaneKart/IKWv3
    region: P
    module_guest_base: 0x81800000
    module_link_base: 0x803992E0
    output: build/mods/insane_kart_full_cpp
    # 0x80005EFC: the online-only anti-Wiimmfi word in .init (FKW has it too; no translated function
    # holds it). 0x81500010: a branch into the module from an address outside the game (the console
    # side's own code; nothing lives there in the recomp). 0x8002125C: strlen's `lbzu` replaced by a
    # branch to a null-pointer guard IKW writes into low memory (0x800018A8), which the recomp can't
    # run; runtime/src/hle/insane_kart.cpp guards strlen instead.
    # Not droppable and not needed: IKW's Random Combinations rewrites game code at run time (thunks
    # at 0x80002700/0x80002720); in the recomp those writes don't reach translated code, so that
    # option does nothing. The veneer at 0x800009C8 is folded by translate-mod (LowMemoryVeneerFolder).
    drop_commands: ["0x80005EFC", "0x81500010", "0x8002125C"]
    riivolution:
      xml: Binaries/boot.thfs
      options:
        # The XML's section is named " " (the translator trims it); no section matches any.
        - option: Pack
          choice: 1
